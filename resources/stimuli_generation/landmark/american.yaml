extends: ./base.yaml
slug: american
description: Synthetic American landmark stimuli.
stimuli_generation:
  prompts:
    prompt: >-
      documentary travel photograph,
      centered composition,
      clear architectural detail,
      neutral daylight,
      no people,
      an iconic landmark in the United States
    prompt_3: >-
      A documentary-style photograph
      of one landmark
      in the United States.
      The landmark is centered in frame,
      clearly visible,
      photographed in neutral daylight,
      with no people,
      no text,
      and no distracting foreground objects.
      The subject should read clearly
      as an American landmark.
