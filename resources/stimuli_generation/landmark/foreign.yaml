extends: ./base.yaml
slug: foreign
description: Synthetic foreign landmark stimuli.
stimuli_generation:
  prompts:
    prompt: >-
      documentary travel photograph,
      centered composition,
      clear architectural detail,
      neutral daylight,
      no people,
      an iconic landmark outside the United States
    prompt_3: >-
      A documentary-style photograph
      of one landmark
      outside the United States.
      The landmark is centered in frame,
      clearly visible,
      photographed in neutral daylight,
      with no people,
      no text,
      and no distracting foreground objects.
      The subject should read clearly
      as a foreign landmark.
