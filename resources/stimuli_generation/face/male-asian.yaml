      Asian man age 30 to 45,
      studio portrait photo,
      one person, centered,
      facing camera,
      neutral expression,
      closed mouth,
      soft even lighting,
      plain light gray background,
      highly detailed skin texture
    prompt_3: >-
      A standardized studio portrait of an Asian man between 30 and 45 years old,
      photographed from the waist up. The subject is perfectly centered and looking
      directly into the lens. The background is a flat, solid light gray. The lighting
      is soft, diffused, and shadowless across the face. The man has a calm, neutral
