      White Caucasian woman age 30 to 45,
      studio portrait photo,
      one person, centered,
      facing camera,
      neutral expression,
      closed mouth,
      plain light gray background,
      soft even lighting,
      highly detailed skin texture
    prompt_3: >-
      A standardized studio portrait of a White Caucasian woman between 30 and 45 years old,
      photographed from the waist up. The subject is perfectly centered and looking directly
